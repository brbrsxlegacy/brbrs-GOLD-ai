<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>brbrs Gold AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Inter,Arial,sans-serif;
  background:#050505;
  color:white;
}
body{
  background:
    radial-gradient(circle at 20% 10%,rgba(255,215,90,.20),transparent 30%),
    radial-gradient(circle at 90% 20%,rgba(178,120,0,.18),transparent 30%),
    linear-gradient(135deg,#030303,#100b02 55%,#000);
}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}

.login{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(16px);
}
.loginBox{
  width:min(430px,100%);
  padding:28px;
  border-radius:28px;
  border:1px solid rgba(255,215,90,.42);
  background:linear-gradient(180deg,rgba(26,19,5,.96),rgba(5,5,5,.96));
  box-shadow:0 0 60px rgba(255,215,90,.18);
}
.logo{
  width:72px;
  height:72px;
  border-radius:24px;
  display:grid;
  place-items:center;
  font-size:34px;
  font-weight:900;
  color:#090600;
  background:linear-gradient(135deg,#fff4b5,#ffd75e,#a86d00);
  box-shadow:0 0 36px rgba(255,215,90,.55);
}
.loginBox h1{margin:16px 0 6px;color:#fff1b0}
.loginBox p{margin:0 0 18px;color:#b9ad8d;line-height:1.45}
input,textarea{
  width:100%;
  outline:0;
  border:1px solid rgba(255,215,90,.28);
  color:white;
  background:rgba(0,0,0,.48);
  border-radius:16px;
  padding:13px 14px;
}
.goldBtn{
  margin-top:12px;
  width:100%;
  padding:13px 16px;
  border-radius:16px;
  font-weight:900;
  color:#090600;
  background:linear-gradient(135deg,#fff4b5,#ffd75e,#a86d00);
  box-shadow:0 0 24px rgba(255,215,90,.25);
  transition:.15s;
}
.goldBtn:hover{transform:translateY(-1px) scale(1.015)}
.goldBtn:active{transform:scale(.98)}

.app{
  height:100dvh;
  display:grid;
  grid-template-columns:300px minmax(0,1fr);
  overflow:hidden;
}
.side{
  min-width:0;
  padding:18px;
  background:rgba(0,0,0,.38);
  border-right:1px solid rgba(255,215,90,.20);
  backdrop-filter:blur(16px);
  display:flex;
  flex-direction:column;
  gap:12px;
}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:48px;height:48px;border-radius:16px;font-size:22px}
.muted{color:#b9ad8d;font-size:12px}
.card{
  padding:14px;
  border-radius:20px;
  background:rgba(255,215,90,.07);
  border:1px solid rgba(255,215,90,.15);
}
.btn{
  padding:12px 14px;
  border-radius:15px;
  font-weight:900;
  color:#090600;
  background:linear-gradient(135deg,#fff4b5,#ffd75e,#a86d00);
}
.btn.ghost{
  color:white;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
}
.btn.danger{
  color:white;
  background:linear-gradient(135deg,#c53b3b,#5d0808);
}
.chatList{
  margin-top:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
  overflow-y:auto;
  max-height:100%;
  padding-right:4px;
}
.chatList::-webkit-scrollbar,.chat::-webkit-scrollbar{width:9px}
.chatList::-webkit-scrollbar-thumb,.chat::-webkit-scrollbar-thumb{
  background:rgba(255,215,90,.32);
  border-radius:99px;
}
.item{
  width:100%;
  text-align:left;
  color:white;
  padding:11px;
  border-radius:14px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,215,90,.14);
}
.item.active{
  background:rgba(255,215,90,.16);
  border-color:rgba(255,215,90,.5);
}

.main{
  min-width:0;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.top{
  flex:0 0 auto;
  min-height:72px;
  padding:14px 18px;
  background:rgba(0,0,0,.34);
  border-bottom:1px solid rgba(255,215,90,.15);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.status{color:#ffd75e;font-size:13px}

.chat{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:14px;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
.row{display:flex;animation:pop .14s ease-out}
.row.user{justify-content:flex-end}
@keyframes pop{
  from{opacity:0;transform:translateY(7px)}
  to{opacity:1;transform:translateY(0)}
}
.msg{
  max-width:min(760px,76%);
  padding:14px 16px;
  border-radius:20px;
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.55;
}
.user .msg{
  color:#090600;
  background:linear-gradient(135deg,#fff4b5,#ffd75e,#b98411);
  border-bottom-right-radius:6px;
  box-shadow:0 0 20px rgba(255,215,90,.18);
}
.ai .msg{
  background:rgba(255,255,255,.075);
  border:1px solid rgba(255,215,90,.14);
  border-bottom-left-radius:6px;
}

.composer{
  flex:0 0 auto;
  padding:12px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom));
  display:flex;
  gap:10px;
  background:rgba(0,0,0,.55);
  border-top:1px solid rgba(255,215,90,.15);
}
.composer textarea{
  min-height:50px;
  max-height:130px;
  resize:none;
}
.send{
  width:96px;
  border-radius:16px;
  font-weight:900;
  color:#090600;
  background:linear-gradient(135deg,#fff4b5,#ffd75e,#a86d00);
}

.mobileTop{
  display:none;
}

@media(max-width:820px){
  .app{
    grid-template-columns:1fr;
  }
  .side{
    display:none;
  }
  .main{
    height:100dvh;
  }
  .top{
    min-height:64px;
    padding:12px 14px;
  }
  .chat{
    padding:14px;
  }
  .msg{
    max-width:90%;
    font-size:14px;
  }
  .composer{
    gap:8px;
    padding:10px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom));
  }
  .send{
    width:78px;
  }
  .mobileTop{
    display:inline-block;
  }
}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="loginBox">
    <div class="logo">B</div>
    <h1>brbrs Gold AI</h1>
    <p>Adını yaz. Her ad kendi sohbetlerini ayrı saklar.</p>
    <input id="nameInput" placeholder="Adını yaz..." autocomplete="off">
    <button class="goldBtn" onclick="login()">Giriş Yap</button>
  </div>
</div>

<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">B</div>
      <div>
        <b>brbrs Gold</b>
        <div class="muted">Premium Gemini Chat</div>
      </div>
    </div>

    <div class="card">
      <div class="muted">Hesap</div>
      <b id="account">-</b>
    </div>

    <button class="btn" onclick="newChat()">Yeni Sohbet</button>
    <button class="btn ghost" onclick="logout()">Çıkış Yap</button>
    <button class="btn danger" onclick="deleteChat()">Bu Sohbeti Sil</button>

    <div class="card" style="flex:1;min-height:0;overflow:hidden">
      <b>Sohbetler</b>
      <div id="chatList" class="chatList"></div>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <div>
        <b id="title">Yeni Sohbet</b>
        <div class="muted">Mouse tekerleği ve mobil kaydırma aktif</div>
      </div>
      <div id="status" class="status">Hazır</div>
    </div>

    <div id="chat" class="chat"></div>

    <div class="composer">
      <textarea id="input" placeholder="Mesaj yaz... Enter gönderir, Shift+Enter alt satır"></textarea>
      <button class="send" onclick="sendMessage()">Gönder</button>
    </div>
  </main>
</div>

<script>
let user = localStorage.getItem("gold_user") || "";
let currentId = localStorage.getItem("gold_current") || "";

const loginBox = document.getElementById("login");
const nameInput = document.getElementById("nameInput");
const account = document.getElementById("account");
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const list = document.getElementById("chatList");
const title = document.getElementById("title");
const statusText = document.getElementById("status");

function safeUserKey(){
  return "gold_chats_" + user.toLowerCase().replace(/\s+/g,"_");
}
function getChats(){
  if(!user) return [];
  return JSON.parse(localStorage.getItem(safeUserKey()) || "[]");
}
function setChats(chats){
  localStorage.setItem(safeUserKey(), JSON.stringify(chats));
}
function makeTitle(text){
  return String(text || "Yeni Sohbet").trim().split(/\s+/).slice(0,6).join(" ").slice(0,45) || "Yeni Sohbet";
}
function getCurrent(){
  return getChats().find(c => c.id === currentId);
}
function scrollBottom(){
  requestAnimationFrame(() => chat.scrollTop = chat.scrollHeight);
}
function saveChat(c){
  let chats = getChats();
  const i = chats.findIndex(x => x.id === c.id);
  if(i >= 0) chats[i] = c;
  else chats.unshift(c);
  chats.sort((a,b) => (b.updated || 0) - (a.updated || 0));
  setChats(chats);
  renderList();
}
function login(){
  const val = nameInput.value.trim();
  if(!val){
    alert("Ad yaz kanka");
    return;
  }
  user = val;
  localStorage.setItem("gold_user", user);
  account.textContent = user;
  loginBox.classList.add("hidden");

  const chats = getChats();
  if(chats.length && !getCurrent()){
    currentId = chats[0].id;
    localStorage.setItem("gold_current", currentId);
  }
  renderList();
  renderChat();
}
function logout(){
  localStorage.removeItem("gold_user");
  localStorage.removeItem("gold_current");
  location.reload();
}
function newChat(){
  currentId = "";
  localStorage.removeItem("gold_current");
  chat.innerHTML = "";
  title.textContent = "Yeni Sohbet";
  renderList();
  input.focus();
}
function deleteChat(){
  if(!currentId) return;
  const chats = getChats().filter(c => c.id !== currentId);
  setChats(chats);
  currentId = chats[0]?.id || "";
  localStorage.setItem("gold_current", currentId);
  renderList();
  renderChat();
}
function ensureChat(first){
  let c = getCurrent();
  if(c) return c;

  c = {
    id: crypto.randomUUID(),
    title: makeTitle(first),
    messages: [],
    updated: Date.now()
  };
  currentId = c.id;
  localStorage.setItem("gold_current", currentId);
  saveChat(c);
  return c;
}
function renderList(){
  const chats = getChats();
  list.innerHTML = "";
  if(!chats.length){
    list.innerHTML = "<div class='muted' style='margin-top:8px'>Sohbet yok</div>";
    return;
  }
  chats.forEach(c => {
    const b = document.createElement("button");
    b.className = "item" + (c.id === currentId ? " active" : "");
    b.innerHTML = "<b>" + escapeHtml(c.title) + "</b><br><span class='muted'>" + new Date(c.updated).toLocaleString("tr-TR") + "</span>";
    b.onclick = () => {
      currentId = c.id;
      localStorage.setItem("gold_current", currentId);
      renderList();
      renderChat();
    };
    list.appendChild(b);
  });
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[m]));
}
function addMsg(role,text){
  const row = document.createElement("div");
  row.className = "row " + (role === "user" ? "user" : "ai");
  const bubble = document.createElement("div");
  bubble.className = "msg";
  bubble.textContent = text;
  row.appendChild(bubble);
  chat.appendChild(row);
  scrollBottom();
  return bubble;
}
function renderChat(){
  chat.innerHTML = "";
  const c = getCurrent();
  if(!c){
    title.textContent = "Yeni Sohbet";
    return;
  }
  title.textContent = c.title;
  c.messages.forEach(m => addMsg(m.role, m.text));
}
async function sendMessage(){
  const text = input.value.trim();
  if(!text) return;

  input.value = "";
  input.style.height = "50px";

  const c = ensureChat(text);
  if(c.messages.length === 0){
    c.title = makeTitle(text);
    title.textContent = c.title;
  }

  c.messages.push({role:"user", text});
  c.updated = Date.now();
  saveChat(c);
  addMsg("user", text);

  statusText.textContent = "Düşünüyor...";
  const loading = addMsg("assistant", "Yazıyor...");

  try{
    const history = c.messages.slice(-12).map(m => ({
      role: m.role === "assistant" ? "assistant" : "user",
      content: m.text
    }));

    const res = await fetch("/chat", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text, history})
    });

    const data = await res.json();
    let reply = data.reply || "Cevap yok kanka.";

    if(reply.includes("Quota exceeded") || reply.includes("quota")){
      reply = "Gemini kotası dolmuş kanka. Biraz bekle veya Render Environment'ta GEMINI_MODEL=gemini-1.5-flash dene.";
    }

    loading.textContent = reply;
    c.messages.push({role:"assistant", text:reply});
    c.updated = Date.now();
    saveChat(c);
  }catch(e){
    loading.textContent = "Sunucuya bağlanamadım kanka. Render loglarına bak.";
  }

  statusText.textContent = "Hazır";
}
input.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
input.addEventListener("input", () => {
  input.style.height = "50px";
  input.style.height = Math.min(input.scrollHeight,130) + "px";
});
nameInput.addEventListener("keydown", e => {
  if(e.key === "Enter") login();
});

if(user){
  account.textContent = user;
  loginBox.classList.add("hidden");
  renderList();
  renderChat();
}else{
  setTimeout(() => nameInput.focus(),100);
}
</script>

</body>
</html>
