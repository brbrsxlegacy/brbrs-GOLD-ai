<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>brbrs Gold AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial;background:radial-gradient(circle at top,#3b2b08,#050505 45%,#000);color:#fff;height:100vh;overflow:hidden}
button{cursor:pointer;border:0;font-weight:900}
.login{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.75);z-index:5}
.box{width:min(420px,92%);padding:28px;border-radius:28px;background:rgba(20,15,5,.95);border:1px solid #ffd76a;box-shadow:0 0 60px #ffd76a33}
.logo{width:70px;height:70px;border-radius:22px;background:linear-gradient(135deg,#fff2b0,#ffd76a,#9d6b00);display:grid;place-items:center;color:#080500;font-size:34px;font-weight:900;box-shadow:0 0 35px #ffd76a88}
h1{margin:16px 0 6px;color:#fff2b0}
p{color:#c9bb98}
input,textarea{width:100%;border:1px solid #ffd76a55;background:#070707;color:white;border-radius:16px;padding:14px;font:inherit;outline:none}
.gold{margin-top:12px;width:100%;padding:14px;border-radius:16px;background:linear-gradient(135deg,#fff2b0,#ffd76a,#a87300);color:#090600;box-shadow:0 0 25px #ffd76a44}
.gold:hover{transform:scale(1.02)}
.app{height:100vh;display:grid;grid-template-columns:300px 1fr}
.side{padding:18px;background:rgba(0,0,0,.42);border-right:1px solid #ffd76a33;backdrop-filter:blur(16px);display:flex;flex-direction:column;gap:12px}
.brand{display:flex;gap:12px;align-items:center}
.brand .logo{width:48px;height:48px;font-size:23px;border-radius:16px}
.card{padding:14px;border-radius:20px;background:rgba(255,215,106,.07);border:1px solid #ffd76a22}
.btn{padding:12px;border-radius:15px;background:#ffd76a;color:#090600}
.ghost{background:#ffffff12;color:white;border:1px solid #ffffff22}
.danger{background:#7d1111;color:white}
.list{overflow:auto;display:flex;flex-direction:column;gap:8px}
.item{padding:12px;text-align:left;border-radius:14px;background:#ffffff10;color:white;border:1px solid #ffd76a22}
.item.active{background:#ffd76a22;border-color:#ffd76a}
.main{display:flex;flex-direction:column}
.top{height:72px;padding:16px 20px;background:#00000044;border-bottom:1px solid #ffd76a22;display:flex;align-items:center;justify-content:space-between}
.chat{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.row{display:flex}.row.user{justify-content:flex-end}
.msg{max-width:75%;padding:14px 16px;border-radius:20px;white-space:pre-wrap;line-height:1.5}
.user .msg{background:linear-gradient(135deg,#fff2b0,#ffd76a,#b88412);color:#090600;border-bottom-right-radius:6px}
.ai .msg{background:#ffffff12;border:1px solid #ffd76a22;border-bottom-left-radius:6px}
.composer{display:flex;gap:10px;padding:14px;background:#00000066;border-top:1px solid #ffd76a22}
.composer textarea{height:52px;resize:none}
.send{width:95px;border-radius:16px;background:linear-gradient(135deg,#fff2b0,#ffd76a,#9d6b00)}
@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}.msg{max-width:88%}}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="box">
    <div class="logo">B</div>
    <h1>brbrs Gold AI</h1>
    <p>Adını yaz. Her ad kendi sohbetlerini ayrı tutar.</p>
    <input id="nameInput" placeholder="Adını yaz">
    <button class="gold" onclick="login()">Giriş Yap</button>
  </div>
</div>

<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">B</div>
      <div>
        <b>brbrs Gold</b>
        <div style="color:#b8ad91;font-size:12px">Premium AI Chat</div>
      </div>
    </div>

    <div class="card">
      <div style="color:#b8ad91;font-size:12px">Hesap</div>
      <b id="account">-</b>
    </div>

    <button class="btn" onclick="newChat()">Yeni Sohbet</button>
    <button class="btn ghost" onclick="logout()">Çıkış</button>
    <button class="btn danger" onclick="deleteChat()">Bu Sohbeti Sil</button>

    <div class="card" style="flex:1;min-height:0">
      <b>Sohbetler</b>
      <div id="chatList" class="list" style="margin-top:10px"></div>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <div>
        <b id="title">Yeni Sohbet</b>
        <div style="color:#b8ad91;font-size:12px">İlk mesaj sohbet adı olur</div>
      </div>
      <div id="status" style="color:#ffd76a">Hazır</div>
    </div>

    <div id="chat" class="chat"></div>

    <div class="composer">
      <textarea id="input" placeholder="Mesaj yaz..."></textarea>
      <button class="send" onclick="sendMessage()">Gönder</button>
    </div>
  </main>
</div>

<script>
let user = localStorage.getItem("gold_user") || "";
let currentId = localStorage.getItem("gold_current") || "";

const loginBox = document.getElementById("login");
const nameInput = document.getElementById("nameInput");
const account = document.getElementById("account");
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const list = document.getElementById("chatList");
const title = document.getElementById("title");
const statusText = document.getElementById("status");

function key(){
  return "gold_chats_" + user.toLowerCase().replaceAll(" ","_");
}

function getChats(){
  return JSON.parse(localStorage.getItem(key()) || "[]");
}

function setChats(chats){
  localStorage.setItem(key(), JSON.stringify(chats));
}

function makeTitle(text){
  return text.split(" ").slice(0,6).join(" ").slice(0,45) || "Yeni Sohbet";
}

function getCurrent(){
  return getChats().find(c => c.id === currentId);
}

function saveChat(c){
  let chats = getChats();
  const i = chats.findIndex(x => x.id === c.id);
  if(i >= 0) chats[i] = c;
  else chats.unshift(c);
  chats.sort((a,b) => b.updated - a.updated);
  setChats(chats);
  renderList();
}

function login(){
  const val = nameInput.value.trim();
  if(!val){ alert("Ad yaz kanka"); return; }

  user = val;
  localStorage.setItem("gold_user", user);
  account.textContent = user;
  loginBox.style.display = "none";

  const chats = getChats();
  if(chats.length && !getCurrent()){
    currentId = chats[0].id;
    localStorage.setItem("gold_current", currentId);
  }

  renderList();
  renderChat();
}

function logout(){
  localStorage.removeItem("gold_user");
  localStorage.removeItem("gold_current");
  location.reload();
}

function newChat(){
  currentId = "";
  localStorage.removeItem("gold_current");
  chat.innerHTML = "";
  title.textContent = "Yeni Sohbet";
  renderList();
}

function deleteChat(){
  if(!currentId) return;
  const chats = getChats().filter(c => c.id !== currentId);
  setChats(chats);
  currentId = chats[0]?.id || "";
  localStorage.setItem("gold_current", currentId);
  renderList();
  renderChat();
}

function ensureChat(first){
  let c = getCurrent();
  if(c) return c;

  c = {
    id: crypto.randomUUID(),
    title: makeTitle(first),
    messages: [],
    updated: Date.now()
  };

  currentId = c.id;
  localStorage.setItem("gold_current", currentId);
  saveChat(c);
  return c;
}

function renderList(){
  const chats = getChats();
  list.innerHTML = "";

  if(!chats.length){
    list.innerHTML = "<div style='color:#b8ad91;font-size:13px'>Sohbet yok</div>";
    return;
  }

  chats.forEach(c => {
    const b = document.createElement("button");
    b.className = "item" + (c.id === currentId ? " active" : "");
    b.innerHTML = "<b>" + c.title + "</b><br><small>" + new Date(c.updated).toLocaleString("tr-TR") + "</small>";
    b.onclick = () => {
      currentId = c.id;
      localStorage.setItem("gold_current", currentId);
      renderList();
      renderChat();
    };
    list.appendChild(b);
  });
}

function addMsg(role,text){
  const row = document.createElement("div");
  row.className = "row " + (role === "user" ? "user" : "ai");

  const bubble = document.createElement("div");
  bubble.className = "msg";
  bubble.textContent = text;

  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

function renderChat(){
  chat.innerHTML = "";
  const c = getCurrent();

  if(!c){
    title.textContent = "Yeni Sohbet";
    return;
  }

  title.textContent = c.title;
  c.messages.forEach(m => addMsg(m.role,m.text));
}

async function sendMessage(){
  const text = input.value.trim();
  if(!text) return;

  input.value = "";

  const c = ensureChat(text);
  if(c.messages.length === 0){
    c.title = makeTitle(text);
    title.textContent = c.title;
  }

  c.messages.push({role:"user",text});
  c.updated = Date.now();
  saveChat(c);
  addMsg("user",text);

  statusText.textContent = "Düşünüyor...";
  const loading = addMsg("assistant","...");

  try{
    const history = c.messages.slice(-12).map(m => ({
      role: m.role === "assistant" ? "assistant" : "user",
      content: m.text
    }));

    const res = await fetch("/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text,history})
    });

    const data = await res.json();
    const reply = data.reply || "Cevap yok kanka.";

    loading.textContent = reply;
    c.messages.push({role:"assistant",text:reply});
    c.updated = Date.now();
    saveChat(c);
  }catch(e){
    loading.textContent = "Sunucuya bağlanamadım kanka. Render loglarına bak.";
  }

  statusText.textContent = "Hazır";
}

input.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

nameInput.addEventListener("keydown", e => {
  if(e.key === "Enter") login();
});

if(user){
  account.textContent = user;
  loginBox.style.display = "none";
  renderList();
  renderChat();
}
</script>

</body>
</html>
